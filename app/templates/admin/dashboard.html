<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Ponto Eletrônico</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand">Ponto Eletrônico | Administração</span>

        <div>
            <a href="{{ url_for('main.home') }}"
               class="btn btn-outline-light btn-sm">
                Meu ponto
            </a>

            <a href="{{ url_for('auth.logout') }}"
               class="btn btn-danger btn-sm">
                Sair
            </a>
        </div>
    </div>
</nav>

<div class="container mt-5">

    <h2>Painel Administrativo</h2>
    <p class="text-muted">
        Bem-vindo, {{ current_user.nome }}!
    </p>

    <div class="mt-4 mb-4">
    <a href="{{ url_for('admin.listar_funcionarios') }}"
       class="btn btn-primary">
        Gerenciar funcionários
    </a>
</div>

    <div class="row g-4 mt-3">

        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <h5>Total de funcionários</h5>
                    <h2>{{ total_funcionarios }}</h2>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <h5>Funcionários ativos</h5>
                    <h2>{{ total_ativos }}</h2>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <h5>Registros de ponto</h5>
                    <h2>{{ total_registros }}</h2>
                </div>
            </div>
        </div>

    </div>

</div>

</body>
</html>
