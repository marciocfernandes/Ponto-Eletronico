<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Ponto Eletrônico - Login</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>


<body class="bg-light">


    <div class="container">

        <div class="row justify-content-center align-items-center"
             style="min-height: 100vh;">

            <div class="col-md-5 col-lg-4">


                <!-- CARD DE LOGIN -->

                <div class="card shadow">

                    <div class="card-body p-4">


                        <!-- TÍTULO -->

                        <h2 class="text-center mb-2">
                            Ponto Eletrônico
                        </h2>

                        <p class="text-center text-muted mb-4">
                            Sistema de Controle de Jornada
                        </p>


                        <!-- MENSAGENS -->

                        {% with messages = get_flashed_messages() %}

                            {% if messages %}

                                {% for message in messages %}

                                    <div
                                        class="alert alert-danger"
                                        role="alert">

                                        {{ message }}

                                    </div>

                                {% endfor %}

                            {% endif %}

                        {% endwith %}


                        <!-- FORMULÁRIO -->

                        <form
                            method="POST"
                            action="{{ url_for('auth.login') }}">


                            <!-- E-MAIL -->

                            <div class="mb-3">

                                <label
                                    for="email"
                                    class="form-label">

                                    E-mail

                                </label>

                                <input
                                    type="email"
                                    id="email"
                                    name="email"
                                    class="form-control"
                                    placeholder="Digite seu e-mail"
                                    autocomplete="email"
                                    required>

                            </div>


                            <!-- SENHA -->

                            <div class="mb-4">

                                <label
                                    for="senha"
                                    class="form-label">

                                    Senha

                                </label>

                                <input
                                    type="password"
                                    id="senha"
                                    name="senha"
                                    class="form-control"
                                    placeholder="Digite sua senha"
                                    autocomplete="current-password"
                                    required>

                            </div>


                            <!-- BOTÃO -->

                            <button
                                type="submit"
                                class="btn btn-primary w-100">

                                Entrar

                            </button>


                        </form>


                    </div>

                </div>


                <!-- RODAPÉ -->

                <p class="text-center text-muted mt-3">

                    Projeto acadêmico - Sistema de Ponto Eletrônico

                </p>


            </div>

        </div>

    </div>


</body>

</html>
